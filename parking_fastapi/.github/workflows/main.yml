name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd parking_fastapi
        pip install -r requirements.txt

    - name: Run tests
      run: |
        cd parking_fastapi
        pytest -v tests/

    - name: Lint with flake8
      run: |
        cd parking_fastapi
        flake8 app/ tests/

    - name: Type check with mypy
      run: |
        cd parking_fastapi
        mypy app/ tests/

    - name: Check formatting with black
      run: |
        cd parking_fastapi
        black --diff --check app/ tests/

    - name: Check imports with isort
      run: |
        cd parking_fastapi
        isort --check-only app/ tests/
